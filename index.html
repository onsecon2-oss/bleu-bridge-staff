 const on=D.logs.filter(l=>!l.out),late=D.logs.filter(l=>ymd(l.in)===t&&l.status==='late');
 const miss=D.logs.filter(l=>{if(l.out||l.status==='corrected')return false;const a=D.assignments.find(x=>x.id===l.assign);return a&&now>new Date(a.end).getTime()+S2().missing_out_hours*36e5});
 const absent=D.assignments.filter(a=>a.date===t&&sched(monday(t)).status==='published'&&new Date(a.start)<now&&!D.logs.some(l=>l.emp===a.emp&&ymd(l.in)===t));
 const nw=nextW(),nosub=D.employees.filter(e=>e.active&&e.role!=='owner'&&!(D.avail[nw]&&D.avail[nw][e.id])),reqs=D.logs.filter(l=>l.corr_req),pend=D.logs.filter(l=>l.pending);
 const list=(a,f)=>a.length?a.map(f).join('<br>'):'<span class="m">없음</span>';
 return`<div class="card"><h2>다음 주 가능일 미제출 (${nosub.length}명)</h2>${nosub.length?nosub.map(e=>e.name).join(', '):'<span class="m">전원 제출 완료</span>'}</div><div class="card"><h2>지금 근무 중 (${on.length})</h2>${list(on,l=>emp(l.emp).name+' · '+hm(l.in)+' 출근')}</div>
 <div class="card"><h2>오늘 지각</h2>${list(late,l=>emp(l.emp).name+' '+hm(l.in))}<h3>오늘 미출근</h3>${list(absent,a=>emp(a.emp).name+' 예정 '+hm(a.start))}</div>
 <div class="card"><h2>퇴근 미기록</h2>${list(miss,l=>emp(l.emp).name+' '+fmtD(ymd(l.in)))}</div>
 <div class="card"><h2>승인 대기</h2>${list(pend,l=>emp(l.emp).name+' '+fmtD(ymd(l.in))+' ('+(l.fail||l.out_fail)+')')}<h3>정정 요청</h3>${list(reqs,l=>emp(l.emp).name+' '+fmtD(ymd(l.in))+': '+l.corr_req.reason)}</div>`}
const S2=()=>D.store.settings;
function att(){const rows=[...D.logs].reverse();
 return`<div class="card"><div class="row"><h2>근태 관리</h2><button class="s sm" onclick="csv()">CSV 내보내기</button></div><p class="m">기록은 삭제할 수 없고, 수정은 사유와 함께 이력으로 남습니다.</p>
 <div class="grid"><table><tr><th>이름</th><th>날짜</th><th>출근</th><th>퇴근</th><th>상태</th><th></th></tr>${rows.map(l=>`<tr><td>${emp(l.emp).name}</td><td>${fmtD(ymd(l.in))}</td><td>${hm(l.in)}</td><td>${l.out?hm(l.out):'-'}</td><td>${l.pending?'<span class="tag to">대기</span>':l.status==='late'?'<span class="tag tr">지각</span>':l.status==='corrected'?'<span class="tag tg">수정됨</span>':'<span class="tag tg">정상</span>'}${l.corr_req?'<span class="tag to">정정요청</span>':''}</td><td><button class="s sm" onclick="fix('${l.id}')">수정/승인</button></td></tr>`).join('')}</table></div></div>
 <div class="card"><h3>수정 이력 (${D.audit.length})</h3>${D.audit.slice(-8).reverse().map(a=>`<div class="m">${hm(a.at)} ${a.entity} · ${a.reason||''}</div>`).join('')||'<span class="m">없음</span>'}</div>`}
function fix(id){const l=D.logs.find(x=>x.id===id),inT=prompt('출근 시각 (HH:MM)',hm(l.in));if(inT===null)return;const outT=prompt('퇴근 시각 (HH:MM, 없으면 비움)',l.out?hm(l.out):'');if(outT===null)return;
 const r=prompt('수정 사유 (필수)',l.corr_req?l.corr_req.reason:'');if(!r)return alert('사유가 필요합니다');
 const before={in:l.in,out:l.out,status:l.status},d=ymd(l.in);l.in=toUTC(d,inT);l.out=outT?toUTC(d,outT):null;l.status='corrected';l.pending=false;delete l.corr_req;audit('attendance_log',l.id,before,{in:l.in,out:l.out},r);save();render()}
function csv(){const r=[['이름','날짜','출근','퇴근','상태']].concat(D.logs.map(l=>[emp(l.emp).name,ymd(l.in),hm(l.in),l.out?hm(l.out):'',l.status]));
 const b=new Blob(['\ufeff'+r.map(x=>x.join(',')).join('\n')],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='attendance.csv';a.click()}
function staffTab(){const S=S2();
 return`<div class="card"><h2>직원 관리</h2>${D.employees.filter(e=>e.role!=='owner').map(e=>`<div class="row" style="padding:6px 0;border-bottom:1px solid #eee"><span><span class="chip" style="background:${e.color};display:inline-block">${e.name}</span> <span class="m">${e.phone} · 시급 ${e.wage.toLocaleString()}원 ${e.active?'':'(퇴사)'}</span></span><button class="s sm" onclick="editEmp('${e.id}')">수정</button></div>`).join('')}
 <button style="margin-top:12px" onclick="editEmp()">+ 직원 등록</button></div>
 <div class="card"><h2>매장 설정</h2><h3>스케줄 추천 기준</h3><label>영업 시작</label><select id="t1">${opts(S.open)}</select><label>영업 종료</label><select id="t2">${opts(S.close)}</select><label>평일 필요 인원 (시간대별)</label><input id="t3" type="number" value="${S.needWD}"><label>주말 필요 인원</label><input id="t4" type="number" value="${S.needWE}"><label>하루 최대 근무시간</label><input id="t5" type="number" value="${S.maxDay}"><label>주 최대 근무시간</label><input id="t6" type="number" value="${S.maxWeek}"><h3>시간대별 필요 인원 예외</h3><p class="m">기본 필요 인원 위에 덮어쓰는 규칙입니다. (0명 = 근무 불필요)</p>${(S.bands||[]).map((b,i)=>`<div class="row" style="gap:4px;margin-bottom:6px"><select id="bd${i}" style="flex:1.2"><option value="all" ${b.d==='all'?'selected':''}>매일</option><option value="wd" ${b.d==='wd'?'selected':''}>평일</option><option value="we" ${b.d==='we'?'selected':''}>주말</option></select><select id="bs${i}" style="flex:1.5">${opts(b.s)}</select><select id="be${i}" style="flex:1.5">${opts(b.e)}</select><input id="bn${i}" type="number" value="${b.n}" style="flex:1"><button class="d sm" onclick="delBand(${i})">삭제</button></div>`).join('')}<button class="s sm" onclick="addBand()">+ 예외 추가</button><h3>출퇴근 인증 (나중 기능)</h3><label>위도</label><input id="s1" value="${S.lat}"><label>경도</label><input id="s2" value="${S.lng}"><label>인증 반경(m)</label><input id="s3" value="${S.geofence_m}">
 <label>지각 유예(분)</label><input id="s4" value="${S.late_grace_min}"><label>최저시급</label><input id="s5" value="${S.min_wage}">
 <p class="m">매장 좌표는 네이버 지도에서 확인해 정확히 입력하세요. 현재 값은 여수 소호동 대략 위치입니다.</p>
 <button onclick="saveSet()">설정 저장</button> </div>`}
function collectBands(){const S=S2();S.bands=(S.bands||[]).map((b,i)=>$('#bd'+i)?{d:$('#bd'+i).value,s:$('#bs'+i).value,e:$('#be'+i).value,n:+$('#bn'+i).value}:b)}
function addBand(){collectBands();S2().bands.push({d:'all',s:'12:00',e:'14:00',n:3});save();render()}
function delBand(i){collectBands();S2().bands.splice(i,1);save();render()}
function saveSet(){const S=S2();collectBands();S.open=$('#t1').value;S.close=$('#t2').value;S.needWD=+$('#t3').value;S.needWE=+$('#t4').value;S.maxDay=+$('#t5').value;S.maxWeek=+$('#t6').value;S.lat=+$('#s1').value;S.lng=+$('#s2').value;S.geofence_m=+$('#s3').value;S.late_grace_min=+$('#s4').value;S.min_wage=+$('#s5').value;save();alert('저장했습니다')}
function editEmp(id){const e=id?emp(id):{name:'',phone:'',wage:S2().min_wage,pin:'',active:true};
 $('#dlg').innerHTML=`<h2>${id?'직원 수정':'직원 등록'}</h2><label>이름</label><input id="n1" value="${e.name}"><label>아이디</label><input id="n2" value="${e.phone}"><label>시급</label><input id="n3" value="${e.wage}">
 <p class="m">※ 새 직원이 로그인하려면 계정을 따로 만들어야 합니다.</p>
 ${id?`<label>상태</label><select id="n5"><option value="1" ${e.active?'selected':''}>재직</option><option value="0" ${e.active?'':'selected'}>퇴사</option></select>`:''}
 <div class="row" style="margin-top:14px"><button class="s" onclick="$('#dlg').close()">취소</button><button onclick="saveEmp('${id||''}')">저장</button></div>`;$('#dlg').showModal()}
function saveEmp(id){const w=+$('#n3').value;if(w<S2().min_wage)return alert('최저시급('+S2().min_wage+'원) 미만은 등록할 수 없습니다');
 const o=id?emp(id):{id:'e'+Date.now(),role:'staff',color:COLORS[D.employees.length%6],pin:'1234'};
 o.name=$('#n1').value;o.phone=$('#n2').value.trim().toLowerCase();o.wage=w;if($('#n4').value)o.pin=$('#n4').value;if(id)o.active=$('#n5').value==='1';else D.employees.push(o);
 save();$('#dlg').close();render()}
function render(){const own=me&&me.role==='owner';
 const tabs=!me?[]:own?[['board','스케줄'],['dash','가능일 현황'],['staff','직원·설정']]:[['av','가능일'],['week','일정']];
 $('#app').innerHTML=(me?`<header><div><b>BLEU BRIDGE</b><small>${me.name}${own?' (사장)':''}</small></div><button class="s sm" onclick="logout()">로그아웃</button></header>`:'')+'<main>'+view()+'</main>'+
 (me?'<nav>'+tabs.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="tab='${t[0]}';render()">${t[1]}</button>`).join('')+'</nav>':'')}
render();boot();
</script></body></html>
